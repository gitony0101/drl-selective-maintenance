[pytest]
# Test lifecycle markers for the FD001 V2 milestone.
#
# Marker semantics:
#   legacy_v1
#       Tests that exercise invalidated V1 artifacts or require a frozen V1
#       reproduction environment. They are not part of the V2 pipeline.
#       They are preserved for reference but excluded from default runs.
#
#   requires_v2_cache
#       Integration tests that require the real generated V2 prediction cache
#       to be present on disk. Excluded from the default pre-training suite.
#
# Recommended invocations:
#   Fresh clone (no external assets): pytest -m "not legacy_v1 and not requires_v2_cache and not requires_external_assets"
#   With external assets:              pytest -m "not legacy_v1 and not requires_v2_cache"
#   Post-training default:             pytest -m "not legacy_v1"
#   Legacy only:                       pytest -m "legacy_v1"

markers =
    legacy_v1: Tests that exercise invalidated V1 artifacts or require a frozen V1 reproduction environment; not part of the V2 canonical pipeline.
    requires_v2_cache: Post-training integration tests that require the real generated V2 prediction cache to be present on disk.
    requires_external_assets: Tests requiring external generated checkpoints, caches, or experiment assets (DRL_EXTERNAL_ROOT).
    slow: Tests that are computationally expensive or take a long time to run.
